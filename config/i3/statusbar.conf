general {
  output_format = "i3bar"
  colors = true
  interval = 1
}

# order += "ipv6"
order += "path_exists VPN"
order += "wireless wlan0"
order += "ethernet eth0"
order += "tztime brightness_holder"
order += "volume master"
order += "battery 0"
order += "battery 1"
order += "cpu_temperature 0"
order += "cpu_usage"
order += "memory"
order += "disk /"
order += "tztime berlin"

tztime brightness_holder {
  format = "brightness_holder"
}

wireless wlan0 {
  format_up = "wlan0: (%quality at %essid, %bitrate) %ip"
  format_down = "wlan0: (down)"
}

path_exists VPN {
  path = "/proc/sys/net/ipv4/conf/wg0-mullvad/"
}

ethernet eth0 {
  format_up = "eth0: %ip (%speed)"
  format_down = "eth0: down"
}

battery 0 {
  format = "%status %percentage"
  format_down = "No battery"
  status_chr = "CHR"
  status_bat = "BAT0"
  status_unk = "UNK"
  status_full = "FULL"
  status_idle = "IDLE"
  last_full_capacity = true
  integer_battery_capacity = true
  path = "/sys/class/power_supply/BAT0/uevent"
  low_threshold = 20
}

battery 1 {
  format = "%status %percentage"
  format_down = "No battery"
  status_chr = "CHR"
  status_bat = "BAT1"
  status_unk = "UNK"
  status_full = "FULL"
  status_idle = "IDLE"
  last_full_capacity = true
  integer_battery_capacity = true
  path = "/sys/class/power_supply/BAT1/uevent"
  low_threshold = 20
}

volume master {
  format = "VOL: %volume"
  format_muted = "VOL: muted (%volume)"
  device = "default"
  mixer = "Master"
  mixer_idx = 0
}

tztime berlin {
  format = "%H:%M"
  align = "center"
  timezone = "Europe/Berlin"
}

cpu_temperature 0 {
  format = "%degrees °C"
}

cpu_usage {
  format = "%usage"
  max_threshold = 90
}

memory {
  format = "%used"
  threshold_degraded = "10%"
  format_degraded = "MEMORY: %free"
}

disk "/" {
  format = "%free"
}
